<!DOCTYPE html>
  <html lang="ja">
    <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="style.css">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>HTML&CSS総合課題②</title>
    </head>
    <body>
      <section class="whole-container">
        <div class="header">
          <h1>平均年収比較</h1>
          <p>都道府県別・地域別の平均年収を比較したデータです。</p>
        </div>
        <div class="cards">
          <div class="cards-card">
            <h2>新潟県燕市(私の地元)</h2>
              <p>約307万円(2022年)</p>
          </div>
          <div class="cards-card">
            <h2>東京都</h2>
              <p>約598万円(2022年)</p>
          </div>
          <div class="cards-card">
            <h2>大阪府</h2>
              <p>約524万円(2022年)</p>
          </div>
        </div>
        <div class="table-section">
          <h2>データ一覧</h2>
          <table class="data-table">
            <tr class="date-table-thead">
              <th>項目</th>
              <th>説明</th>
              <th>データ</th>
            </tr>
            <tr class="date-table-tbody">
              <td>新潟県燕市</td>
              <td>厚生労働省発表の「賃金構造基本統計調査」をもとに、<br>年収状況を算出。</td>
              <td>約307万円(2022年)</td>
            </tr>
            <tr class="date-table-tbody">
              <td>東京都</td>
              <td>厚生労働省発表の「賃金構造基本統計調査」をもとに、<br>年収状況を算出。</td>
              <td>約598万円(2022年)</td>
            </tr>
            <tr class="date-table-tbody">
              <td>大阪府</td>
              <td>厚生労働省発表の「賃金構造基本統計調査」をもとに、<br>年収状況を算出。</td>
              <td>約524万円(2022年)</td>
            </tr>
          </table>
        </div>
      </section>
    </body>
  </html>
